[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-dots"
version = "0.1.0"
description = "Local Dots V1.0 - personal secretary + dual-engine (Jarvis/Codex) async task system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.2",
    "deepagents>=0.7",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 300
norecursedirs = ["tmp_workspace"]
