name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Ruff style check (advisory)
        continue-on-error: true
        run: |
          python -m pip install "ruff==0.17.6"
          ruff check --extend-select C90,I --config lint.mccabe.max-complexity=10 --no-fix --no-fix-only .
      - name: Architecture gate (import-linter)
        run: |
          python -m pip install "import-linter==2.15"
          lint-imports
      - name: Run pytest
        run: python -m pytest -q