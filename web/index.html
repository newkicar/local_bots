<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Dots</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <span class="brand">Local Dots</span>
  <span id="conn" class="conn" title="SSE 状态推送">● 离线</span>
  <button id="btn-logout" class="ghost" type="button">退出</button>
</header>

<main class="wrap" id="wrap">
  <!-- 聊天面板 -->
  <section id="panel-chat" class="panel">
    <div id="chat-msgs" class="chat-msgs" aria-live="polite"></div>
    <form id="chat-form" class="chat-form">
      <input id="chat-input" type="text" placeholder="找秘书：派活 / 查任务 / 追问 / 取消…" autocomplete="off">
      <button type="submit">发送</button>
    </form>
  </section>

  <!-- 任务列表面板 -->
  <section id="panel-tasks" class="panel hidden">
    <div class="panel-actions">
      <button id="btn-refresh-tasks" class="ghost" type="button">刷新</button>
    </div>
    <div id="task-list"></div>
  </section>

  <!-- 审批面板 -->
  <section id="panel-approvals" class="panel hidden">
    <div class="panel-actions">
      <button id="btn-refresh-approvals" class="ghost" type="button">刷新</button>
    </div>
    <div class="auto-mode" id="auto-mode-row">
      <span class="auto-mode-label">代审模式</span>
      <button class="ghost auto-mode-btn" data-mode="manual" type="button">手动</button>
      <button class="ghost auto-mode-btn" data-mode="auto_safe" type="button">有限代审</button>
      <button class="warn auto-mode-btn" data-mode="yolo" type="button">YOLO 全放行</button>
    </div>
    <div class="auto-mode-note" id="auto-mode-note"></div>
    <div id="approval-list"></div>
  </section>

  <!-- 结果面板 -->
  <section id="panel-results" class="panel hidden">
    <div class="panel-actions">
      <button id="btn-refresh-results" class="ghost" type="button">刷新</button>
    </div>
    <div id="result-list"></div>
  </section>
</main>

<nav class="tabbar">
  <button class="tab active" data-panel="chat" type="button"><span class="lbl">聊天</span></button>
  <button class="tab" data-panel="tasks" type="button"><span class="lbl">任务</span><span class="badge hidden" id="badge-tasks"></span></button>
  <button class="tab" data-panel="approvals" type="button"><span class="lbl">审批</span><span class="badge hidden" id="badge-approvals"></span></button>
  <button class="tab" data-panel="results" type="button"><span class="lbl">结果</span><span class="badge hidden" id="badge-results"></span></button>
</nav>

<!-- 悬浮回顶/回底控件：四个面板共享，跟随 .wrap 滚动容器；不可滚动时自动隐藏 -->
<div class="scroll-arrows" id="scroll-arrows">
  <button id="to-top" class="arrow" type="button" title="回到顶部" aria-label="回到顶部">↑</button>
  <button id="to-bottom" class="arrow" type="button" title="回到底部" aria-label="回到底部">↓</button>
</div>

<!-- 登录 -->
<div id="login" class="overlay hidden">
  <form id="login-form" class="login-card">
    <h1>Local Dots</h1>
    <p>本机回环访问，输入 API Token（Bearer）</p>
    <input id="login-token" type="password" placeholder="API Token" autocomplete="off" required>
    <button type="submit">进入</button>
    <p id="login-err" class="err"></p>
  </form>
</div>

<script src="/app.js"></script>
</body>
</html>
